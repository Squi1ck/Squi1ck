name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#a855f7&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8
            dist/snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#161b22,#4c1d95,#6d28d9,#8b5cf6,#c4b5fd

      - name: Publicar no ramo output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
